name: Dynamic Pricing CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate training data and train models
      run: |
        python -c "from src.models.train import ModelTrainer; ModelTrainer().train_pipeline(force_regenerate=True)"

    - name: Run Test Suite
      run: |
        pytest tests/ -v
